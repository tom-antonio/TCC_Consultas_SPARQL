services:
  fuseki:
    image: stain/jena-fuseki:latest
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD}
      FUSEKI_DATASET_1: TADS_2026_2
    volumes:
      - fuseki-data:/fuseki
      - ./backend/data:/staging:ro
    ports:
      - "3030:3030"

  backend:
    build:
      context: ./backend
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      FUSEKI_QUERY_URL: http://fuseki:3030/TADS_2026_2
      FUSEKI_USER: admin
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD}
    volumes:
      - anythingllm-storage:/anythingllm-storage
    depends_on:
      - fuseki
    ports:
      - "8000:8000"

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    environment:
      STORAGE_DIR: /app/server/storage
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_BASE_PATH: http://backend:8000/v1
      GENERIC_OPEN_AI_API_KEY: ${ANYTHINGLLM_GENERIC_API_KEY:-anythingllm-local}
      GENERIC_OPEN_AI_MODEL_PREF: semantic-ifg
      EMBEDDING_ENGINE: ""
      EMBEDDING_MODEL_PREF: ""
    volumes:
      - anythingllm-storage:/app/server/storage
      - ./anythingllm/reset-on-new-thread.sh:/usr/local/bin/reset-on-new-thread.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/reset-on-new-thread.sh"]
    depends_on:
      - backend
    ports:
      - "3001:3001"

volumes:
  fuseki-data:
  anythingllm-storage:
